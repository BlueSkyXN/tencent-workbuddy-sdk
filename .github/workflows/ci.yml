name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/workbuddy-enterprises/python-sdk
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit + contract tests
        run: python -m pytest tests/unit tests/contract
      - name: Build sdist and wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build
      - name: Upload artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/workbuddy-enterprises/python-sdk/dist/*

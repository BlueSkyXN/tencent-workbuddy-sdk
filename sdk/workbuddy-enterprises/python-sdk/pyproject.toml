[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy-enterprise"
version = "0.1.0"
description = "Unofficial synchronous Python SDK for CodeBuddy / WorkBuddy Enterprise OpenAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Local maintainers" }]
keywords = ["workbuddy", "codebuddy", "openapi", "enterprise", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/local/tencent-workbuddy-sdk"
Documentation = "https://www.codebuddy.cn/apiDocs/index.html"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbuddy_enterprise = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: live API tests (disabled by default)",
  "live_write: live write tests (never in default CI)",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
